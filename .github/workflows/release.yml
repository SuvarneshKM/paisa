name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
      release_title:
        description: "Release title"
        required: false
        default: "Paisa v1.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Paisa $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias paisa_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass paisa_secure_keystore_password \
              -keypass paisa_secure_keystore_password \
              -dname "CN=Paisa, OU=Mobile, O=Paisa, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="app/build/outputs/apk/release/paisa-${TAG}.apk"
          
          cp "$APK_SRC" "$APK_DEST"
          
          cd app/build/outputs/apk/release
          shasum -a 256 "paisa-${TAG}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TITLE="${{ steps.vars.outputs.title }}"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating release assets..."
            gh release upload "$TAG" \
              "app/build/outputs/apk/release/paisa-${TAG}.apk#Paisa ${TAG} APK" \
              "app/build/outputs/apk/release/SHA256SUMS.txt#SHA-256 Checksums" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              "app/build/outputs/apk/release/paisa-${TAG}.apk#Paisa ${TAG} APK" \
              "app/build/outputs/apk/release/SHA256SUMS.txt#SHA-256 Checksums" \
              --title "$TITLE" \
              --generate-notes
          fi
